<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar suscripción · Río Profundo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06141f">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
  @font-face {
    font-family: 'Fraunces'; font-style: normal; font-weight: 400 900; font-display: swap;
    src: url('fonts/fraunces-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Spline Sans Mono'; font-style: normal; font-weight: 400 600; font-display: swap;
    src: url('fonts/spline-mono-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root {
    --abismo:#06141f; --agua:#0a2540; --cian:#5fd4e6;
    --espuma:#eaf6f8; --niebla:#8fb2c4; --rojo:#e8556b; --verde:#4fd1a5;
    --linea:rgba(143,178,196,.18); --vidrio:rgba(14,51,84,.55);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Spline Sans Mono',monospace;
    background:radial-gradient(ellipse 120% 80% at 50% -10%, var(--agua) 0%, var(--abismo) 70%), var(--abismo);
    background-attachment:fixed; color:var(--espuma); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(14px,3vw,32px); -webkit-font-smoothing:antialiased;
  }
  .caja {
    max-width:32rem; text-align:center;
    background:var(--vidrio); border:1px solid var(--linea); border-radius:16px;
    padding:32px 28px;
  }
  h1 {
    font-family:'Fraunces',serif; font-weight:700;
    font-size:clamp(1.4rem,4vw,1.8rem); line-height:1.2; margin-bottom:14px;
  }
  p { font-size:.88rem; line-height:1.7; color:var(--niebla); margin-bottom:14px; }
  p:last-child { margin-bottom:0; }
  a { color:var(--cian); }
  .bien h1 { color:var(--verde); }
  .mal h1 { color:var(--rojo); }
  /* CTA de WhatsApp: la confirmación es el momento de más intención. Botón verde
     WhatsApp para que enganche; el precio se ve claro en Mi cuenta (sin dark pattern). */
  .cta { margin-top:24px; padding-top:22px; border-top:1px solid var(--linea); }
  .cta .q { font-size:.92rem; line-height:1.6; color:var(--espuma); margin-bottom:16px; }
  .btn-ws {
    display:inline-flex; align-items:center; gap:9px;
    background:#25d366; color:#04231a; text-decoration:none;
    font-family:'Fraunces',serif; font-weight:700; font-size:1.02rem;
    padding:14px 26px; border-radius:13px;
    box-shadow:0 8px 24px rgba(37,211,102,.28);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn-ws:hover { transform:translateY(-1px); box-shadow:0 10px 30px rgba(37,211,102,.38); }
  .btn-ws svg { width:22px; height:22px; fill:#04231a; }
  .cta .note { font-size:.74rem; line-height:1.5; color:var(--niebla); margin-top:14px; }
  .sec { display:inline-block; margin-top:22px; font-size:.85rem; color:var(--niebla); }
</style>
</head>
<body>

<!-- Esta página existe para que el botón del mail apunte a rioprofundo.com y no
     a workers.dev: un dominio compartido gratuito en un botón "Confirmar" es
     una señal fuerte de spam, y el mail de confirmación es justo el que TIENE
     que llegar a la bandeja. La confirmación real la hace el Worker; acá sólo
     se le delega y se muestra el resultado. -->

<div class="caja" id="caja">
  <h1 id="t">Confirmando…</h1>
  <p id="p">Un segundo.</p>
</div>

<script>
(function () {
  var API = 'https://restless-smoke-596c.vresti.workers.dev/confirmar';
  var caja = document.getElementById('caja');
  var t = document.getElementById('t');
  var p = document.getElementById('p');

  function pinta(clase, titulo, texto) {
    caja.className = 'caja ' + clase;
    t.textContent = titulo;
    p.innerHTML = texto + '<br><br><a href="/">Ir a Río Profundo</a>';
  }

  var token = new URLSearchParams(location.search).get('t') || '';
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(token)) {
    pinta('mal', 'Link inválido', 'Ese link no es válido o está incompleto. Podés suscribirte otra vez desde la home.');
    return;
  }

  fetch(API + '?j=1&t=' + encodeURIComponent(token))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j && j.ok) {
        // ⚡ AUTO-LOGIN (25/07/2026). Si el Worker mandó sesión, este click ya
        // demostró que la casilla es suya: se guarda y se la lleva ADENTRO de su
        // cuenta, en vez de pedirle la misma prueba otra vez.
        //
        // ⚠️ POR QUÉ IMPORTA TANTO EN EL CELULAR: este link se abre casi siempre
        // en el navegador EMBEBIDO del cliente de correo. Ahí "andá a Mi cuenta y
        // fijate el código que te mandamos por mail" es un callejón sin salida —
        // para leer el código hay que salir del webview, y al salir se pierde la
        // pantalla donde había que escribirlo. Con la sesión hecha, no hay nada
        // que ir a buscar.
        //
        // ⚠️ La caja de "Activar WhatsApp" NO se pierde: está en `cuenta.html`, o
        // sea que la oferta pasa de un botón que llevaba a un muro de login a uno
        // que se puede completar en el acto. Se mueve, no se saca.
        if (j.sesion) {
          try { localStorage.setItem('rp_sesion', j.sesion); } catch (e) { /* modo privado */ }
          caja.className = 'caja bien';
          t.textContent = '¡Listo! Ya estás suscripto';
          p.innerHTML = 'Te vamos a avisar <b>por mail, gratis</b>, cuando el río se salga de lo '
            + 'normal.<br><br>Te estamos abriendo tu cuenta…';
          // `?nuevo=1`: le dice a la cuenta que la confirmación ACABA de pasar, así
          // muestra "Activando…" en vez de "Pausados" mientras el espejo se pone al
          // día. Recién confirmado, "Pausados" es directamente falso.
          setTimeout(function () { location.replace('/cuenta.html?nuevo=1'); }, 1400);
          return;
        }

        // Sin sesión (link viejo, o pasadas las 48 h): el camino de antes.
        caja.className = 'caja bien';
        t.textContent = 'Suscripción confirmada';
        p.innerHTML = 'Vas a recibir los avisos <b>por mail, gratis</b> — cuando el río se salga de lo normal en San Fernando y el Delta. Crecientes y bajantes fuertes, nada más que eso.';
        var wa = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.05 4.91A9.816 9.816 0 0 0 12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.004c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01zM12.04 20.15h-.004c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.264 8.264 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.82 2.42a8.183 8.183 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.25 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43-.14-.01-.31-.01-.48-.01-.17 0-.43.06-.66.31-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29z"/></svg>';
        var cta = document.createElement('div');
        cta.className = 'cta';
        cta.innerHTML =
            '<p class="q">¿Querés que además te avisemos por <b>WhatsApp</b>? Te llega al toque, sin abrir el mail.</p>'
          + '<a class="btn-ws" href="/cuenta.html">' + wa + 'Quiero los avisos por WhatsApp</a>'
          + '<p class="note">Servicio aparte · pago único anual · lo activás desde Mi cuenta</p>'
          + '<a class="sec" href="/">Ir a Río Profundo</a>';
        caja.appendChild(cta);
      } else {
        pinta('mal', 'No se pudo confirmar', 'Ese link no es válido o ya venció. Probá suscribirte de nuevo.');
      }
    })
    .catch(function () {
      pinta('mal', 'No se pudo conectar',
        'Revisá tu conexión y volvé a abrir el link del mail. Si sigue fallando, escribinos a <a href="mailto:info@rioprofundo.com">info@rioprofundo.com</a>.');
    });
})();
</script>
</body>
</html>
